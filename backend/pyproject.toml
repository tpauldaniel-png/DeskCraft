[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py314"
line-length =88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "PIE"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest_env]
env_files = [".env.test"]