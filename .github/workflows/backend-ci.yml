name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deskcraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d deskcraft_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deskcraft_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deskcraft_test
      JWT_SECRET_KEY: test-only-secret-key-not-for-production-123456
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      AUTH_COOKIE_SECURE: "false"

    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run backend tests
        run: python -m pytest -v